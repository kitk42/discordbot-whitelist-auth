[project]
name = "whitelist-bot"
version = "0.1.0"
description = "Discord bot that adds Minecraft players to the whitelist via RCON after admin approval"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "discord.py>=2.4",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whitelist_bot"]

[tool.uv]
# 本番では ProtectHome=true のためホーム配下の uv 管理 Python を使えない。OS 標準の Python に固定する。
python-preference = "only-system"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# コメント・メッセージは日本語で書くため、全角の括弧とコロンを許可する
allowed-confusables = ["（", "）", "："]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
