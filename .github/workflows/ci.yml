name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # 本番 VM と同じ Ubuntu 24.04（OS 標準の Python 3.12 を使う）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
